name: Build

# Runs on every push and every pull request, so there is always a downloadable
# build to load in Chrome without checking out the repo or running npm.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile is the build input, and
      # a CI run that silently resolves different versions is not testing what
      # anyone will actually load.
      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Fail loudly here rather than shipping an artifact that Chrome rejects
      # on load for a missing file.
      - name: Verify the build is loadable
        run: |
          test -f dist/manifest.json || { echo "dist/manifest.json missing"; exit 1; }
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            const missing = [];
            const check = (p) => { if (p && !fs.existsSync('dist/' + p)) missing.push(p); };
            check(m.background?.service_worker);
            check(m.side_panel?.default_path);
            check(m.options_page);
            Object.values(m.icons ?? {}).forEach(check);
            (m.content_scripts ?? []).flatMap((c) => c.js ?? []).forEach(check);
            if (missing.length) {
              console.error('Manifest references files missing from dist/:', missing);
              process.exit(1);
            }
            console.log('manifest v' + m.manifest_version + ' — every referenced file is present');
          "

      # Uploaded as the extension's files, not as a zip of a zip: GitHub already
      # serves an artifact as a single zip, so downloading gives you exactly one
      # archive to unpack and load.
      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: motion-extension-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Say where to find it
        run: |
          echo "### Motion build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **motion-extension-${{ github.sha }}** from the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Unzip it." >> "$GITHUB_STEP_SUMMARY"
          echo "2. Open \`chrome://extensions\` and turn on **Developer mode**." >> "$GITHUB_STEP_SUMMARY"
          echo "3. Choose **Load unpacked** and select the unzipped folder." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Open a D2L or MyLearningSpace page and click the Motion icon." >> "$GITHUB_STEP_SUMMARY"
