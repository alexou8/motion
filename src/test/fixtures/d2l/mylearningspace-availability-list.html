<!--
  Synthetic fixture modelled on MyLearningSpace Dropbox availability rows.
  Contains no real student or course data: every name and date is invented.
  Availability is deliberately separate from an explicit due date so the
  adapter must not present an availability end as a confirmed deadline.
-->
<!doctype html>
<html>
  <head><title>Dropbox Folders - CS101 - Example Course - Example University</title></head>
  <body>
    <h1>Dropbox Folders</h1>
    <table class="d2l-table d2l-grid">
      <tbody>
        <tr>
          <th class="d_ich"><label>Example Due Assignment</label></th>
          <td><div class="d2l-folderdates-wrapper"><div class="d2l-folderdate-wrapper-row">Due on Oct 14, 2025 11:59 PM</div><div class="d2l-folderdate-wrapper-row">Available until Oct 20, 2025 11:59 PM</div></div></td>
        </tr>
        <tr>
          <th class="d_ich"><label>Example Availability Assignment</label></th>
          <td><div class="d2l-folderdates-wrapper"><div class="d2l-folderdate-wrapper-row">Available on Nov 1, 2025 until Nov 20, 2025</div><div class="d2l-folderdate-wrapper-row">Starts Nov 1, 2025</div></div></td>
        </tr>
        <tr>
          <th class="d_ich"><label>Example Starts Assignment</label></th>
          <td><div class="d2l-folderdates-wrapper"><div class="d2l-folderdate-wrapper-row">Available on Dec 1, 2025</div><div class="d2l-folderdate-wrapper-row">Starts Dec 1, 2025</div></div></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
